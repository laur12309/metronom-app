<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Înregistrări Audio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
      color: #edf3ff;
      background: radial-gradient(ellipse at 15% 15%, #162447 0%, transparent 50%),
                  radial-gradient(ellipse at 85% 85%, #0f3057 0%, transparent 45%),
                  #07090e;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #65e8ff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: 0.15s ease;
    }

    .back-btn:hover {
      background: rgba(101, 232, 255, 0.15);
      transform: translateX(-2px);
    }

    /* Insignă de stare colț dreapta sus */
    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 20px;
      background: rgba(101, 232, 255, 0.08);
      border: 1px solid rgba(101, 232, 255, 0.2);
      color: #b8e2f2;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
    }

    .status-dot.recording {
      background: #ff5277;
      box-shadow: 0 0 10px #ff5277;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.4; }
    }

    .icon-wrapper {
      width: 56px;
      height: 56px;
      margin: 44px auto 12px;
      border-radius: 50%;
      background: rgba(101, 232, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 28px;
      height: 28px;
      stroke: #65e8ff;
    }

    h1 {
      color: #9ac2ff;
      font-size: 1.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    p {
      color: #8b94a8;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 3.2rem;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px;
      text-shadow: 0 0 25px rgba(101, 232, 255, 0.4);
    }

    .wave-container {
      width: 100%;
      height: 64px;
      margin-bottom: 24px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      border: 0;
      border-radius: 26px;
      background: linear-gradient(135deg, #1f56e0, #3895ff);
      box-shadow: 0 8px 25px rgba(31, 86, 224, 0.4);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .main-btn.recording {
      background: linear-gradient(135deg, #c43149, #f05270);
      box-shadow: 0 8px 25px rgba(196, 49, 73, 0.45);
    }

    .main-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    /* Doar butonul rotund curat, fara text dedesubt */
    .round-history-btn {
      width: 54px;
      height: 54px;
      margin: 24px auto 0;
      border-radius: 50%;
      border: 1px solid rgba(101, 232, 255, 0.28);
      background: rgba(101, 232, 255, 0.08);
      color: #65e8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .round-history-btn:hover {
      background: rgba(101, 232, 255, 0.2);
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(101, 232, 255, 0.4);
    }

    .round-history-btn svg {
      width: 24px;
      height: 24px;
      stroke: #65e8ff;
    }

    /* Modal Istoric de Sticlă */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(18, 24, 38, 0.95);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8);
      text-align: left;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      color: #9ac2ff;
      letter-spacing: 1px;
    }

    .close-modal {
      background: transparent;
      border: 0;
      color: #8b94a8;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .close-modal:hover {
      color: #ffffff;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: 0.15s ease;
    }

    .history-item:hover {
      background: rgba(101, 232, 255, 0.12);
      border-color: #65e8ff;
      transform: translateX(3px);
    }

    .item-info strong {
      display: block;
      color: #ffffff;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .item-info small {
      color: #8b94a8;
      font-size: 0.75rem;
    }

    .item-arrow {
      color: #65e8ff;
      font-size: 1.1rem;
    }

    .empty-modal-text {
      text-align: center;
      color: #6b778d;
      font-size: 0.85rem;
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <main class="card">
    <a href="metronom.html" class="back-btn">
      ← Înapoi
    </a>

    <!-- Insignă colț dreapta sus cu bulină -->
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusLabel">Gata de înregistrare</span>
    </div>

    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </div>

    <h1>Înregistrări</h1>
    <p>Calitate acustică de studio</p>

    <div class="timer" id="recTimer">00:00</div>

    <div class="wave-container">
      <canvas id="visualizer"></canvas>
    </div>

    <button class="main-btn" id="recToggle" type="button">Începe înregistrarea</button>

    <!-- Buton rotund doar cu iconița -->
    <button class="round-history-btn" id="openHistoryModalBtn" type="button" title="Istoric înregistrări">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v4l3 3"></path>
        <circle cx="12" cy="12" r="9"></circle>
      </svg>
    </button>
  </main>

  <!-- Fereastra de Istoric Înregistrări -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Piese înregistrate</h2>
        <button class="close-modal" id="closeModalBtn" type="button">&times;</button>
      </div>
      <div class="history-list" id="modalHistoryList">
        <div class="empty-modal-text" id="emptyModalText">Nu ai nicio înregistrare salvată.</div>
      </div>
    </div>
  </div>

  <script>
    let isRecording = false;
    let mediaRecorder = null;
    let audioStream = null;
    let recordedChunks = [];
    let seconds = 0;
    let timerInterval = null;

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let animId = null;

    const recTimer = document.getElementById("recTimer");
    const recToggle = document.getElementById("recToggle");
    const statusDot = document.getElementById("statusDot");
    const statusLabel = document.getElementById("statusLabel");
    const canvas = document.getElementById("visualizer");
    const canvasCtx = canvas.getContext("2d");

    const historyModal = document.getElementById("historyModal");
    const openHistoryModalBtn = document.getElementById("openHistoryModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalHistoryList = document.getElementById("modalHistoryList");
    const emptyModalText = document.getElementById("emptyModalText");

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function drawIdleLine() {
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      canvasCtx.strokeStyle = "rgba(101, 232, 255, 0.25)";
      canvasCtx.lineWidth = 2;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, canvas.height / 2);
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
    }
    drawIdleLine();

    function formatSec(s) {
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");
      return m + ":" + sec;
    }

    function drawWave() {
      if (!isRecording || !analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / 32);
      let x = 0;

      for (let i = 0; i < 32; i++) {
        const val = dataArray[i * 2] || 0;
        const percent = val / 255;
        const barHeight = Math.max(4, percent * (canvas.height - 8));
        const y = (canvas.height - barHeight) / 2;

        canvasCtx.fillStyle = percent > 0.5 ? "#65e8ff" : "#2d75f0";
        canvasCtx.beginPath();
        canvasCtx.roundRect(x + 2, y, barWidth - 4, barHeight, 4);
        canvasCtx.fill();

        x += barWidth;
      }

      animId = requestAnimationFrame(drawWave);
    }

    // Păstrăm înregistrările în memorie persistentă (IndexedDB)
    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open("StudioRecordsDB", 1);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore("records", { keyPath: "id" });
        };
        req.onsuccess = (e) => resolve(e.target.result);
      });
    }

    async function saveRecord(record) {
      const db = await openDB();
      const tx = db.transaction("records", "readwrite");
      tx.objectStore("records").put(record);
    }

    async function getAllRecords() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction("records", "readonly");
        const req = tx.objectStore("records").getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function startRecording() {
      try {
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        sourceNode = audioCtx.createMediaStreamSource(audioStream);
        sourceNode.connect(analyser);

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(audioStream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
          const id = "rec_" + Date.now();
          const title = "Înregistrare #" + (await getAllRecords()).length;
          const time = new Date().toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
          const date = new Date().toLocaleDateString("ro-RO");

          await saveRecord({
            id: id,
            title: title,
            date: date + " " + time,
            duration: formatSec(seconds),
            blob: blob
          });

          if (audioStream) audioStream.getTracks().forEach(t => t.stop());
          if (audioCtx) audioCtx.close();
        };

        mediaRecorder.start();
        isRecording = true;
        recToggle.textContent = "Oprește înregistrarea";
        recToggle.classList.add("recording");

        statusDot.classList.add("recording");
        statusLabel.textContent = "Se înregistrează...";

        seconds = 0;
        recTimer.textContent = "00:00";
        timerInterval = setInterval(() => {
          seconds++;
          recTimer.textContent = formatSec(seconds);
        }, 1000);

        drawWave();

      } catch (err) {
        statusLabel.textContent = "Eroare microfon";
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }

      isRecording = false;
      recToggle.textContent = "Începe înregistrarea";
      recToggle.classList.remove("recording");

      statusDot.classList.remove("recording");
      statusLabel.textContent = "Gata de înregistrare";

      clearInterval(timerInterval);
      cancelAnimationFrame(animId);
      drawIdleLine();
    }

    recToggle.addEventListener("click", () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });

    // Modal Istoric
    openHistoryModalBtn.addEventListener("click", async () => {
      historyModal.classList.add("open");
      const records = await getAllRecords();
      modalHistoryList.innerHTML = "";

      if (records.length === 0) {
        modalHistoryList.appendChild(emptyModalText);
        emptyModalText.style.display = "block";
        return;
      }

      records.reverse().forEach((rec) => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.innerHTML = `
          <div class="item-info">
            <strong>\({rec.title}</strong>
            <small>\){rec.date} • Durată: \({rec.duration}</small>
          </div>
          <span class="item-arrow">→</span>
        `;
        // Deschide în tab nou player-ul avansat
        item.addEventListener("click", () => {
          window.open("player.html?id=" + rec.id, "_blank");
        });
        modalHistoryList.appendChild(item);
      });
    });

    closeModalBtn.addEventListener("click", () => historyModal.classList.remove("open"));
    historyModal.addEventListener("click", (e) => {
      if (e.target === historyModal) historyModal.classList.remove("open");
    });
  </script>
</body>
</html>
