<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economisire resurse</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 20px;
      color: #edf3ff;
      background:
        radial-gradient(ellipse at 15% 15%, #202a50 0%, transparent 45%),
        #080b12;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .icon {
      width: 58px;
      height: 58px;
      margin-bottom: 10px;
      color: #65e8ff;
    }

    h1 {
      margin: 0 0 10px;
      color: #a8c7ff;
      font-size: 1.4rem;
    }

    p {
      color: #aab5c9;
      line-height: 1.5;
    }

    .notice {
      margin: 18px 0;
      padding: 12px;
      border: 1px solid rgba(101, 232, 255, 0.25);
      border-radius: 12px;
      background: rgba(101, 232, 255, 0.07);
      color: #c8f6ff;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 18px 0;
      padding: 14px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
    }

    .setting-title {
      font-weight: 600;
    }

    .setting-description {
      margin-top: 4px;
      color: #aab5c9;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      accent-color: #65e8ff;
      cursor: pointer;
    }

    #status {
      min-height: 22px;
      margin-top: 16px;
      color: #65e8ff;
      font-size: 0.9rem;
    }

    /* Aceste reguli reduc animațiile și efectele vizuale. */
    body.low-power {
      background: #080b12;
    }

    body.low-power .card {
      background: #111722;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    body.low-power *,
    body.low-power *::before,
    body.low-power *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <!-- Iconiță SVG desenată pentru economisirea resurselor -->
    <svg class="icon" viewBox="0 0 64 64" fill="none"
         xmlns="http://www.w3.org/2000/svg" aria-label="Baterie">
      <rect x="9" y="19" width="42" height="27" rx="5"
            stroke="currentColor" stroke-width="3"/>
      <path d="M53 27H58V38H53"
            stroke="currentColor" stroke-width="3"
            stroke-linejoin="round"/>
      <path d="M17 27V38M25 27V38M33 27V38M41 27V38"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <h1>Economisire resurse</h1>

    <p>
      Activează o interfață mai simplă, cu mai puține efecte vizuale.
    </p>

    <div class="notice">
      Această setare modifică doar aspectul paginii. Nu schimbă modul de
      economisire a bateriei din Windows.
    </div>

    <label class="setting">
      <span>
        <span class="setting-title">Mod simplificat</span>
        <span class="setting-description">
          Reduce fundalurile și animațiile decorative ale acestei pagini.
        </span>
      </span>
      <input id="powerToggle" type="checkbox">
    </label>

    <div id="status" aria-live="polite">
      Mod simplificat oprit.
    </div>
  </main>

  <script>
    const powerToggle = document.getElementById("powerToggle");
    const statusText = document.getElementById("status");

    // Păstrează alegerea în browserul de pe acest dispozitiv.
    const savedSetting = localStorage.getItem("simpleDisplayMode");

    if (savedSetting === "on") {
      powerToggle.checked = true;
      document.body.classList.add("low-power");
      statusText.textContent = "Mod simplificat pornit.";
    }

    powerToggle.addEventListener("change", function () {
      if (powerToggle.checked) {
        document.body.classList.add("low-power");
        localStorage.setItem("simpleDisplayMode", "on");
        statusText.textContent = "Mod simplificat pornit.";
      } else {
        document.body.classList.remove("low-power");
        localStorage.setItem("simpleDisplayMode", "off");
        statusText.textContent = "Mod simplificat oprit.";
      }
    });
  </script>
</body>
</html>
