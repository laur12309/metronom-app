<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Istoric de studiu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 24px 15px 40px;
      color: #edf3ff;
      background:
        radial-gradient(circle at 15% 10%, #202e55 0, transparent 45%),
        radial-gradient(circle at 85% 85%, #163541 0, transparent 42%),
        #070a10;
    }

    .page {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .back {
      display: inline-flex;
      align-items: center;
      margin-bottom: 18px;
      padding: 9px 15px;
      color: #65e8ff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(255,255,255,.06);
    }

    .panel {
      padding: 24px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 24px 65px rgba(0,0,0,.45);
      backdrop-filter: blur(20px);
    }

    h1 {
      color: #a8c7ff;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .description {
      color: #9aa6bb;
      margin-bottom: 22px;
      font-size: .92rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .summary-card {
      padding: 15px 12px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      background: rgba(255,255,255,.045);
    }

    .summary-label {
      color: #9aa6bb;
      font-size: .76rem;
      margin-bottom: 8px;
    }

    .summary-value {
      color: #65e8ff;
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .chart-panel {
      padding: 18px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      background: rgba(255,255,255,.035);
    }

    .chart-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 1rem;
      color: #dce8ff;
    }

    select {
      padding: 9px 12px;
      color: #edf3ff;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      background: #111827;
    }

    canvas {
      display: block;
      width: 100%;
      height: 280px;
    }

    .chart-note {
      margin-top: 12px;
      color: #8793a8;
      font-size: .8rem;
      line-height: 1.5;
    }

    .empty {
      margin-top: 14px;
      padding: 13px;
      color: #b7c3d8;
      font-size: .88rem;
      line-height: 1.5;
      border: 1px solid rgba(101,232,255,.18);
      border-radius: 14px;
      background: rgba(101,232,255,.055);
    }

    @media (max-width: 620px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .panel {
        padding: 18px 14px;
      }

      .chart-panel {
        padding: 14px 10px;
      }

      canvas {
        height: 240px;
      }

      .chart-heading {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="metronom.html">← Înapoi</a>

    <section class="panel">
      <h1>Istoric de studiu</h1>
      <p class="description">Timpul acumulat și distribuția studiului tău.</p>

      <div class="summary">
        <div class="summary-card">
          <div class="summary-label">Astăzi</div>
          <div class="summary-value" id="todayTotal">0 min</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Săptămâna aceasta</div>
          <div class="summary-value" id="weekTotal">0 min</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Luna aceasta</div>
          <div class="summary-value" id="monthTotal">0 min</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Anul acesta</div>
          <div class="summary-value" id="yearTotal">0 min</div>
        </div>
      </div>

      <div class="chart-panel">
        <div class="chart-heading">
          <h2 id="chartTitle">Studiu pe zi</h2>
          <select id="periodSelect" aria-label="Alege perioada graficului">
            <option value="week">Ultimele 7 zile</option>
            <option value="month">Ultimele 30 de zile</option>
            <option value="year">Ultimele 12 luni</option>
          </select>
        </div>

        <canvas id="studyChart"></canvas>
        <p class="chart-note" id="chartNote"></p>
      </div>

      <div class="empty" id="emptyMessage" hidden>
        Încă nu există date salvate. După ce conectăm cronometrul din metronom
        la istoricul de studiu, aici vor apărea totalurile și graficul.
      </div>
    </section>
  </main>

  <script>
    /*
      Formatul de date folosit de pagină:
      localStorage["practiceSecondsByDay"] =
      {"2026-10-12": 1800, "2026-10-13": 2400}
      Valorile sunt secunde studiate în fiecare zi.
    */

    const STORAGE_KEY = "practiceSecondsByDay";
    const canvas = document.getElementById("studyChart");
    const ctx = canvas.getContext("2d");
    const periodSelect = document.getElementById("periodSelect");

    function readDailyData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `\({year}-\){month}-\({day}`;
    }

    function startOfWeek(date) {
      const result = new Date(date);
      const day = (result.getDay() + 6) \% 7;
      result.setDate(result.getDate() - day);
      result.setHours(0, 0, 0, 0);
      return result;
    }

    function sumBetween(data, start, end) {
      let total = 0;
      const cursor = new Date(start);

      while (cursor <= end) {
        total += Number(data[dateKey(cursor)]) || 0;
        cursor.setDate(cursor.getDate() + 1);
      }

      return total;
    }

    function formatDuration(seconds) {
      const totalMinutes = Math.floor(seconds / 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes \% 60;

      if (hours > 0) return `\){hours} h \({minutes} min`;
      return `\){totalMinutes} min`;
    }

    function updateSummary(data) {
      const now = new Date();
      const today = new Date(now);
      today.setHours(0, 0, 0, 0);

      const weekStart = startOfWeek(now);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);

      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);

      const yearStart = new Date(now.getFullYear(), 0, 1);
      const yearEnd = new Date(now.getFullYear(), 11, 31);

      document.getElementById("todayTotal").textContent =
        formatDuration(Number(data[dateKey(today)]) || 0);

      document.getElementById("weekTotal").textContent =
        formatDuration(sumBetween(data, weekStart, weekEnd));

      document.getElementById("monthTotal").textContent =
        formatDuration(sumBetween(data, monthStart, monthEnd));

      document.getElementById("yearTotal").textContent =
        formatDuration(sumBetween(data, yearStart, yearEnd));
    }

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawChart(readDailyData());
    }

    function drawChart(data) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);

      const period = periodSelect.value;
      let values = [];
      let labels = [];

      if (period === "year") {
        document.getElementById("chartTitle").textContent = "Studiu pe lună";

        for (let i = 11; i >= 0; i--) {
          const date = new Date();
          date.setDate(1);
          date.setMonth(date.getMonth() - i);

          const year = date.getFullYear();
          const month = date.getMonth();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          let total = 0;

          for (let day = 1; day <= daysInMonth; day++) {
            total += Number(data[dateKey(new Date(year, month, day))]) || 0;
          }

          values.push(total / 60);
          labels.push(date.toLocaleDateString("ro-RO", { month: "short" }));
        }
      } else {
        const count = period === "month" ? 30 : 7;
        document.getElementById("chartTitle").textContent =
          period === "month" ? "Studiu pe zi — ultimele 30 de zile" : "Studiu pe zi — ultimele 7 zile";

        for (let i = count - 1; i >= 0; i--) {
          const date = new Date();
          date.setHours(0, 0, 0, 0);
          date.setDate(date.getDate() - i);

          values.push((Number(data[dateKey(date)]) || 0) / 60);
          labels.push(
            period === "month"
              ? String(date.getDate())
              : date.toLocaleDateString("ro-RO", { weekday: "short" })
          );
        }
      }

      const left = 42;
      const right = 10;
      const top = 15;
      const bottom = 32;
      const chartWidth = width - left - right;
      const chartHeight = height - top - bottom;
      const maxValue = Math.max(30, Math.ceil(Math.max(...values, 0) / 30) * 30);
      const steps = 4;

      ctx.font = "11px Segoe UI, Arial";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      for (let i = 0; i <= steps; i++) {
        const y = top + chartHeight - (chartHeight * i / steps);
        const value = maxValue * i / steps;

        ctx.strokeStyle = "rgba(255,255,255,0.09)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(width - right, y);
        ctx.stroke();

        ctx.fillStyle = "#8d9bb2";
        ctx.fillText(`${Math.round(value)}m`, left - 7, y);
      }

      const slotWidth = chartWidth / values.length;
      const barWidth = Math.max(3, slotWidth * (values.length > 14 ? 0.58 : 0.48));

      values.forEach((value, index) => {
        const barHeight = Math.max(0, chartHeight * value / maxValue);
        const x = left + index * slotWidth + (slotWidth - barWidth) / 2;
        const y = top + chartHeight - barHeight;

        const gradient = ctx.createLinearGradient(0, y, 0, top + chartHeight);
        gradient.addColorStop(0, "#65e8ff");
        gradient.addColorStop(1, "#315bdb");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, Math.max(2, barHeight), 4);
        ctx.fill();

        const showLabel = values.length <= 7 || index % 5 === 0 || index === values.length - 1;
        if (showLabel) {
          ctx.fillStyle = "#8d9bb2";
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          ctx.fillText(labels[index], x + barWidth / 2, top + chartHeight + 8);
        }
      });

      document.getElementById("chartNote").textContent =
        "Axa verticală arată minutele de studiu. Graficul folosește timpul salvat pentru fiecare zi.";
    }

    function refresh() {
      const data = readDailyData();
      const hasData = Object.values(data).some(value => Number(value) > 0);

      updateSummary(data);
      document.getElementById("emptyMessage").hidden = hasData;
      drawChart(data);
    }

    periodSelect.addEventListener("change", refresh);
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("storage", refresh);

    resizeCanvas();
    refresh();
  </script>
</body>
</html>
