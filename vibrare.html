<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibrare metronom</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 20px;
      color: #edf3ff;
      background:
        radial-gradient(ellipse at 15% 15%, #202a50 0%, transparent 45%),
        #080b12;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .icon {
      width: 58px;
      height: 58px;
      margin-bottom: 10px;
      color: #65e8ff;
      filter: drop-shadow(0 0 10px rgba(101, 232, 255, 0.45));
    }

    h1 {
      margin: 0 0 10px;
      color: #a8c7ff;
      font-size: 1.4rem;
    }

    p {
      color: #aab5c9;
      line-height: 1.5;
    }

    .notice {
      margin: 18px 0;
      padding: 12px;
      color: #c8f6ff;
      font-size: 0.9rem;
      line-height: 1.5;
      border: 1px solid rgba(101, 232, 255, 0.25);
      border-radius: 12px;
      background: rgba(101, 232, 255, 0.07);
    }

    button {
      width: 100%;
      padding: 13px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #315bdb, #338cf5);
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.12);
    }

    #status {
      min-height: 44px;
      margin-top: 16px;
      color: #65e8ff;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <!-- Iconiță SVG desenată pentru vibrație -->
    <svg class="icon" viewBox="0 0 64 64" fill="none"
         xmlns="http://www.w3.org/2000/svg" aria-label="Telefon cu vibrații">
      <rect x="21" y="8" width="22" height="48" rx="5"
            stroke="currentColor" stroke-width="3"/>
      <path d="M28 15H36M30 49H34"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M13 21C9 27 9 37 13 43M51 21C55 27 55 37 51 43"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M7 16C1 25 1 39 7 48M57 16C63 25 63 39 57 48"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <h1>Vibrare metronom</h1>
    <p>Testează dacă dispozitivul și browserul tău acceptă vibrarea.</p>

    <div class="notice">
      Vibrarea este disponibilă mai ales pe unele telefoane. Pe laptop sau
      pe anumite browsere, funcția poate să nu fie acceptată.
    </div>

    <button id="testButton" type="button">Testează vibrarea</button>
    <div id="status" aria-live="polite"></div>
  </main>

  <script>
    const testButton = document.getElementById("testButton");
    const statusText = document.getElementById("status");

    testButton.addEventListener("click", function () {
      if (!("vibrate" in navigator)) {
        statusText.textContent =
          "Acest dispozitiv sau browser nu acceptă vibrarea.";
        return;
      }

      const vibrationStarted = navigator.vibrate([180, 100, 180]);

      if (vibrationStarted) {
        statusText.textContent = "Comanda de vibrare a fost trimisă.";
      } else {
        statusText.textContent =
          "Browserul nu a pornit vibrarea. Încearcă pe un telefon compatibil.";
      }
    });
  </script>
</body>
</html>
