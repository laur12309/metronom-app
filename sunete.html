<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunete metronom</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #edf3ff;
      background: radial-gradient(ellipse at 15% 15%, #1a233d 0%, transparent 50%),
                  radial-gradient(ellipse at 85% 85%, #142838 0%, transparent 45%),
                  #07090e;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #5fe8ff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: 0.15s ease;
    }

    .back-btn:hover {
      background: rgba(95, 232, 255, 0.15);
      transform: translateX(-2px);
    }

    .icon-wrapper {
      width: 56px;
      height: 56px;
      margin: 36px auto 12px;
      border-radius: 50%;
      background: rgba(95, 232, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 28px;
      height: 28px;
      stroke: #5fe8ff;
    }

    h1 {
      color: #8bb2ff;
      font-size: 1.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    p {
      color: #8b94a8;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .sound-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sound-btn {
      padding: 14px 18px;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      color: #edf3ff;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: 0.15s ease;
    }

    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(95, 232, 255, 0.3);
    }

    .sound-btn.selected {
      background: rgba(95, 232, 255, 0.15);
      border-color: #5fe8ff;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(95, 232, 255, 0.2);
    }

    .test-btn {
      width: 100%;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      border-radius: 25px;
      border: 0;
      background: linear-gradient(135deg, #2855e3, #3a8df5);
      box-shadow: 0 8px 25px rgba(40, 85, 227, 0.35);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .test-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    #status {
      min-height: 20px;
      margin-top: 14px;
      color: #5fe8ff;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <main class="card">
    <a href="metronom.html" class="back-btn">
      ← Înapoi
    </a>

    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </div>

    <h1>Sunete</h1>
    <p>Alege timbrul pentru bătăile metronomului</p>

    <div class="sound-list">
      <button class="sound-btn" data-sound="wood" type="button">
        Ton Lemn (Acustic)
      </button>

      <button class="sound-btn" data-sound="block" type="button">
        Woodblock
      </button>

      <button class="sound-btn" data-sound="standard" type="button">
        Ton Clasic
      </button>

      <button class="sound-btn" data-sound="clar" type="button">
        Ton Clar
      </button>
    </div>

    <button class="test-btn" id="testButton" type="button">Testează sunetul</button>
    <div id="status"></div>
  </main>

  <script>
    let audioContext = null;
    const soundButtons = document.querySelectorAll(".sound-btn");
    const statusText = document.getElementById("status");

    const savedSound = localStorage.getItem("metronomeSoundType") || "wood";
    soundButtons.forEach(btn => {
      if (btn.dataset.sound === savedSound) {
        btn.classList.add("selected");
      }
    });

    function playTone(type) {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();

      const t = audioContext.currentTime;

      if (type === "wood") {
        // Trosc scurt de lemn (rezonanță joasă cu cădere rapidă)
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const filter = audioContext.createBiquadFilter();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.035);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(800, t);

        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(t);
        osc.stop(t + 0.045);
      } else if (type === "block") {
        // Clac de woodblock mai ascuțit
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(900, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.03);

        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(t);
        osc.stop(t + 0.04);
      } else if (type === "clar") {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.value = 1500;
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(t);
        osc.stop(t + 0.07);
      } else {
        // Standard
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.value = 1000;
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }
    }

    soundButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        soundButtons.forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");

        const soundType = btn.dataset.sound;
        localStorage.setItem("metronomeSoundType", soundType);
        localStorage.setItem("metronomeSoundName", btn.textContent.trim());

        playTone(soundType);
        statusText.textContent = "Selectat: " + btn.textContent.trim();
      });
    });

    document.getElementById("testButton").addEventListener("click", () => {
      const current = localStorage.getItem("metronomeSoundType") || "wood";
      playTone(current);
      statusText.textContent = "Testat.";
    });
  </script>
</body>
</html>
