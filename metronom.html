<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metronom Studio</title>

  <style>
    :root {
      --text: #edf4ff;
      --muted: #98a9c4;
      --cyan: #63eaff;
      --line: rgba(176, 209, 255, .16);
      --glass: rgba(13, 23, 43, .78);
    }

    * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 15px 120px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(53, 105, 208, .3), transparent 42%),
        radial-gradient(ellipse at 90% 55%, rgba(57, 201, 231, .13), transparent 38%),
        linear-gradient(145deg, #070b14, #0b1220 55%, #080d17);
    }

    button { font: inherit; cursor: pointer; }

    .main-card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 28px 22px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)),
        var(--glass);
      box-shadow: 0 28px 80px rgba(0,0,0,.5), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(24px);
    }

    h1 {
      margin: 0 0 20px;
      color: #d9e8ff;
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .tempo-row { display: flex; align-items: center; justify-content: center; gap: 18px; }

    .tempo-button {
      width: 44px;
      height: 44px;
      color: var(--cyan);
      font-size: 1.6rem;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
      transition: .2s ease;
    }

    .tempo-button:hover {
      background: rgba(99, 234, 255, .15);
      border-color: var(--cyan);
      transform: scale(1.06);
    }

    .tempo-display { min-width: 120px; color: white; font-size: 3.8rem; font-weight: 700; text-shadow: 0 0 25px rgba(99,234,255,.3); }
    .bpm-label { margin: 4px 0 18px; color: var(--muted); font-size: .82rem; letter-spacing: 4px; }
    input[type="range"] { width: 100%; margin-bottom: 20px; accent-color: var(--cyan); }

    .main-button {
      width: 100%;
      max-width: 260px;
      padding: 14px;
      color: #06101a;
      font-weight: 700;
      border: 0;
      border-radius: 28px;
      background: linear-gradient(110deg, #72f0ff, #6a9dff);
      box-shadow: 0 8px 26px rgba(71,133,255,.25);
      transition: .2s ease;
    }

    .main-button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .main-button.running {
      color: #fff;
      background: linear-gradient(110deg, #e34d77, #a34fff);
      box-shadow: 0 8px 26px rgba(227,77,119,.3);
    }

    .dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin: 20px 0; }
    .dot { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.15); transition: .1s ease; }
    .dot.strong { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
    .dot.playing { outline: 2px solid white; outline-offset: 3px; transform: scale(1.2); }

    .rhythm-label { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: .8rem; }
    .divider { height: 1px; margin: 22px 0; background: linear-gradient(90deg,transparent,rgba(176,209,255,.2),transparent); }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .small-card {
      min-height: 140px;
      padding: 16px 10px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.035);
    }

    .card-title { margin-bottom: 12px; color: var(--muted); font-size: .75rem; letter-spacing: 1.5px; text-transform: uppercase; }
    .timer { margin-bottom: 12px; color: var(--cyan); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .frequency { min-height: 24px; margin-bottom: 12px; color: #d2caff; font-size: .85rem; font-weight: 600; }

    .small-button {
      padding: 9px 15px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      transition: .15s ease;
    }
    .small-button:hover { background: rgba(255,255,255,.12); }
    .small-button.active { color: #ff91a7; border-color: #ff5277; background: rgba(255,82,119,.2); }
    .meditation-buttons { display: flex; justify-content: center; gap: 6px; }

    /* UNELTE CU PICTOGRAME IDENTICE CU CELE DIN RITMURI */
    .tools-title { margin-bottom: 12px; color: var(--muted); font-size: .76rem; letter-spacing: 2px; text-transform: uppercase; }
    .tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    .tool-card {
      display: grid;
      justify-items: center;
      gap: 7px;
      padding: 13px 6px;
      color: #c8d7ee;
      text-align: center;
      text-decoration: none;
      font-size: .74rem;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255, 255, 255, .035);
      transition: .18s ease;
    }

    .tool-card:hover {
      color: var(--cyan);
      border-color: rgba(99, 234, 255, .4);
      background: rgba(99, 234, 255, .08);
      transform: translateY(-2px);
    }

    .tool-card svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--cyan);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* BARĂ DE JOS IDENTICĂ */
    .bottom-nav {
      position: fixed;
      right: 14px;
      bottom: 13px;
      left: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      max-width: 520px;
      margin: auto;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(10, 16, 29, .92);
      box-shadow: 0 12px 38px rgba(0,0,0,.45);
      backdrop-filter: blur(18px);
    }

    .nav-item {
      display: grid;
      place-items: center;
      width: 48px;
      height: 44px;
      color: #9daec8;
      border: 0;
      border-radius: 16px;
      background: transparent;
      text-decoration: none;
      transition: .2s ease;
    }

    .nav-item.active, .nav-item:hover { color: var(--cyan); background: rgba(99, 234, 255, .12); }
    .nav-item svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .more-menu {
      position: fixed;
      right: max(18px, calc((100vw - 520px)/2 + 18px));
      bottom: 76px;
      z-index: 11;
      display: none;
      width: min(350px, calc(100% - 36px));
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(13, 18, 29, .97);
      box-shadow: 0 20px 55px rgba(0,0,0,.65);
      backdrop-filter: blur(22px);
    }
    .more-menu.open { display: grid; }
    .more-item {
      padding: 11px;
      color: var(--text);
      font-size: .78rem;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.045);
    }

    /* Modal tonuri */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
      padding: 18px; background: rgba(3,7,15,.75); backdrop-filter: blur(10px);
    }
    .modal-overlay.open { display: flex; }
    .tone-modal {
      width: 100%; max-width: 350px; padding: 22px; border: 1px solid var(--line);
      border-radius: 24px; background: rgba(15, 23, 40, .98); box-shadow: 0 24px 70px #000;
      text-align: left;
    }
    .tone-modal h2 { margin: 0 0 14px; color: #d9e8ff; font-size: 1.05rem; }
    .tone-list { display: grid; gap: 8px; max-height: 280px; overflow: auto; }
    .tone-option {
      padding: 13px; color: var(--text); text-align: left; border: 1px solid var(--line);
      border-radius: 14px; background: rgba(255,255,255,.05);
    }
    .tone-option.selected { border-color: var(--cyan); background: rgba(99,234,255,.12); }
    .back-modal-button {
      width: 100%; margin-top: 14px; padding: 11px; color: var(--cyan);
      border: 1px solid var(--line); border-radius: 15px; background: rgba(99,234,255,.08);
    }
  </style>
</head>

<body>
  <main class="main-card">
    <h1>Metronom</h1>

    <div class="tempo-row">
      <button class="tempo-button" id="minusButton" type="button">−</button>
      <div class="tempo-display" id="tempoDisplay">100</div>
      <button class="tempo-button" id="plusButton" type="button">+</button>
    </div>

    <div class="bpm-label">BPM</div>
    <input id="tempoSlider" type="range" min="40" max="220" value="100">
    <button class="main-button" id="metronomeButton" type="button">Start</button>

    <div class="dots" id="beatDots"></div>
    <div class="rhythm-label" id="rhythmLabel"></div>

    <div class="divider"></div>

    <div class="cards">
      <section class="small-card">
        <div class="card-title">Studiu</div>
        <div class="timer" id="studyTimer">00:00:00</div>
        <button class="small-button" id="studyButton" type="button">Start</button>
      </section>

      <section class="small-card">
        <div class="card-title">Meditație</div>
        <div class="frequency" id="frequencyName">Ambiental</div>
        <div class="meditation-buttons">
          <button class="small-button" id="meditationButton" type="button">Start</button>
          <button class="small-button" id="frequencyButton" type="button">Tonuri</button>
        </div>
      </section>
    </div>

    <div class="divider"></div>
    <div class="tools-title">Unelte</div>

    <div class="tools-grid">
      <a class="tool-card" href="sunete.html">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        Sunete
      </a>
      <a class="tool-card" href="ritmuri.html">
        <svg viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-7M22 20V6"></path></svg>
        Ritmuri
      </a>
      <a class="tool-card" href="rec.html">
        <svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="13" rx="4"></rect><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M9 22h6"></path></svg>
        Înregistrări
      </a>
      <a class="tool-card" href="istoric.html">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        Istoric
      </a>
    </div>
  </main>

  <div class="modal-overlay" id="toneModal">
    <section class="tone-modal">
      <h2>Tonuri pentru meditație</h2>
      <div class="tone-list" id="toneList"></div>
      <button class="back-modal-button" id="closeToneModal" type="button">← Înapoi</button>
    </section>
  </div>

  <div class="more-menu" id="moreMenu">
    <a class="more-item" href="partituri.html">Partituri</a>
    <a class="more-item" href="rec.html">Înregistrări</a>
    <a class="more-item" href="pian.html">Pian digital</a>
    <a class="more-item" href="compune.html">Creează partitură</a>
    <a class="more-item" href="setari.html" style="grid-column:span 2">Setări și cont</a>
  </div>

  <nav class="bottom-nav" aria-label="Navigare">
    <a class="nav-item active" href="metronom.html" title="Metronom">
      <svg viewBox="0 0 24 24"><path d="M7 21h10L15.5 8h-7z"></path><path d="m12 17 3-8"></path><circle cx="12" cy="17" r="1"></circle></svg>
    </a>
    <a class="nav-item" href="practice-history.html" title="Istoric de studiu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    </a>
    <a class="nav-item" href="tuner.html" title="Tuner">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"></path></svg>
    </a>
    <a class="nav-item" href="teorie.html" title="Teorie">
      <svg viewBox="0 0 24 24"><path d="M5 3h14v18H7a2 2 0 0 1-2-2z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
    </a>
    <button class="nav-item" id="moreButton" type="button" title="Mai mult">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
    </button>
  </nav>

  <script>
    const CONFIG_KEY = "activeRhythmConfig";
    const slider = document.getElementById("tempoSlider");
    const bpmDisplay = document.getElementById("tempoDisplay");
    const startButton = document.getElementById("metronomeButton");
    const dots = document.getElementById("beatDots");
    const label = document.getElementById("rhythmLabel");

    let audioContext = null;
    let running = false;
    let interval = null;
    let beatIndex = 0;
    let config = { meter: 4, bpm: 100, pattern: [true,false,false,false], sound: "wood" };

    try {
      const saved = JSON.parse(localStorage.getItem(CONFIG_KEY));
      if (saved) config = { ...config, ...saved };
    } catch {}

    // Sincronizare automată cu sunetul selectat în pagina Sunete (dacă există)
    const customSound = localStorage.getItem("metronomeSoundType");
    if (customSound) config.sound = customSound;

    config.meter = Number(config.meter) || 4;
    config.bpm = Math.min(220, Math.max(40, Number(config.bpm) || 100));
    config.pattern = Array.from({ length: config.meter }, (_, i) => Boolean(config.pattern && config.pattern[i]));
    if (!config.pattern.some(Boolean)) config.pattern[0] = true;

    slider.value = config.bpm;
    bpmDisplay.textContent = String(config.bpm);
    label.textContent = "Măsura " + config.meter + (config.meter === 6 ? "/8" : "/4");

    function renderDots(active = -1) {
      dots.innerHTML = "";
      config.pattern.forEach((strong, i) => {
        const dot = document.createElement("span");
        dot.className = "dot" + (strong ? " strong" : "") + (i === active ? " playing" : "");
        dots.appendChild(dot);
      });
    }

    function getAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playBeat() {
      const context = getAudio();
      const now = context.currentTime;
      const strong = Boolean(config.pattern[beatIndex]);
      const osc = context.createOscillator();
      const gain = context.createGain();
      const filter = context.createBiquadFilter();

      // Citim din nou tipul de sunet din stocarea locală la fiecare bătaie
      const activeSound = localStorage.getItem("metronomeSoundType") || config.sound;

      if (activeSound === "block") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(strong ? 1000 : 720, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.035);
        gain.gain.setValueAtTime(strong ? 0.55 : 0.3, now);
      } else if (activeSound === "standard" || activeSound === "clar") {
        osc.type = "sine";
        osc.frequency.value = activeSound === "clar" ? (strong ? 1500 : 1100) : (strong ? 1000 : 760);
        gain.gain.setValueAtTime(strong ? 0.32 : 0.2, now);
      } else {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(strong ? 560 : 420, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + 0.04);
        filter.type = "lowpass";
        filter.frequency.value = strong ? 950 : 750;
        gain.gain.setValueAtTime(strong ? 0.55 : 0.32, now);
      }

      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(context.destination);
      osc.start(now);
      osc.stop(now + 0.09);

      renderDots(beatIndex);
      beatIndex = (beatIndex + 1) % config.meter;
    }

    function start() {
      if (running) return;
      running = true;
      beatIndex = 0;
      startButton.textContent = "Stop";
      startButton.classList.add("running");
      playBeat();
      interval = setInterval(playBeat, 60000 / Number(slider.value));
    }

    function stop() {
      running = false;
      clearInterval(interval);
      interval = null;
      beatIndex = 0;
      startButton.textContent = "Start";
      startButton.classList.remove("running");
      renderDots();
    }

    startButton.addEventListener("click", () => running ? stop() : start());

    function setBpm(value) {
      const bpm = Math.min(220, Math.max(40, Number(value)));
      slider.value = bpm;
      bpmDisplay.textContent = String(bpm);
      config.bpm = bpm;
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));

      if (running) {
        clearInterval(interval);
        interval = setInterval(playBeat, 60000 / bpm);
      }
    }

    document.getElementById("minusButton").addEventListener("click", () => setBpm(Number(slider.value) - 1));
    document.getElementById("plusButton").addEventListener("click", () => setBpm(Number(slider.value) + 1));
    slider.addEventListener("input", () => setBpm(slider.value));
    renderDots();

    /* Cronometrul de studiu */
    const STUDY_KEY = "practiceSecondsByDay";
    const studyTimer = document.getElementById("studyTimer");
    const studyButton = document.getElementById("studyButton");
    let studyRunning = false;
    let studyInterval = null;
    let lastStudyUpdate = 0;

    function dayKey(date) {
      return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
    }

    function readStudy() {
      try { return JSON.parse(localStorage.getItem(STUDY_KEY)) || {}; }
      catch { return {}; }
    }

    function refreshStudy() {
      const total = Number(readStudy()[dayKey(new Date())]) || 0;
      const h = String(Math.floor(total / 3600)).padStart(2, "0");
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      studyTimer.textContent = h + ":" + m + ":" + s;
    }

    function saveStudyElapsed() {
      if (!studyRunning) return;
      const now = Date.now();
      const elapsed = Math.floor((now - lastStudyUpdate) / 1000);
      if (elapsed < 1) return;

      const data = readStudy();
      for (let i = 1; i <= elapsed; i++) {
        const key = dayKey(new Date(lastStudyUpdate + i * 1000));
        data[key] = (Number(data[key]) || 0) + 1;
      }

      lastStudyUpdate += elapsed * 1000;
      localStorage.setItem(STUDY_KEY, JSON.stringify(data));
      refreshStudy();
    }

    studyButton.addEventListener("click", () => {
      if (!studyRunning) {
        studyRunning = true;
        lastStudyUpdate = Date.now();
        studyButton.textContent = "Stop";
        studyButton.classList.add("active");
        studyInterval = setInterval(saveStudyElapsed, 250);
      } else {
        saveStudyElapsed();
        studyRunning = false;
        clearInterval(studyInterval);
        studyInterval = null;
        studyButton.textContent = "Start";
        studyButton.classList.remove("active");
        refreshStudy();
      }
    });

    window.addEventListener("pagehide", saveStudyElapsed);
    refreshStudy();

    /* Tonuri meditație */
    const tones = [
      { name: "Liniște", frequency: 432, volume: 0.045 },
      { name: "Ambiental", frequency: 528, volume: 0.055 },
      { name: "Ploaie blândă", frequency: 396, volume: 0.045 },
      { name: "Valuri", frequency: 440, volume: 0.06 },
      { name: "Pădure", frequency: 392, volume: 0.05 },
      { name: "Seară calmă", frequency: 480, volume: 0.045 }
    ];

    let toneIndex = Number(localStorage.getItem("meditationToneIndex")) || 1;
    toneIndex = Math.max(0, Math.min(tones.length - 1, toneIndex));

    const frequencyName = document.getElementById("frequencyName");
    const meditationButton = document.getElementById("meditationButton");
    const toneModal = document.getElementById("toneModal");
    const toneList = toneModal.querySelector(".tone-list");

    function showToneName() {
      frequencyName.textContent = tones[toneIndex].name;
    }

    function renderTones() {
      toneList.innerHTML = "";
      tones.forEach((tone, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tone-option" + (index === toneIndex ? " selected" : "");
        button.textContent = tone.name;
        button.addEventListener("click", () => {
          toneIndex = index;
          localStorage.setItem("meditationToneIndex", String(index));
          showToneName();
          renderTones();
        });
        toneList.appendChild(button);
      });
    }

    document.getElementById("frequencyButton").addEventListener("click", () => {
      renderTones();
      toneModal.classList.add("open");
    });

    document.getElementById("closeToneModal").addEventListener("click", () => toneModal.classList.remove("open"));
    toneModal.addEventListener("click", (e) => { if(e.target === toneModal) toneModal.classList.remove("open"); });

    let meditationRunning = false;
    let meditationOscillator = null;
    let meditationGain = null;

    meditationButton.addEventListener("click", () => {
      const context = getAudio();
      if (!meditationRunning) {
        meditationOscillator = context.createOscillator();
        meditationGain = context.createGain();
        meditationOscillator.type = "sine";
        meditationOscillator.frequency.value = tones[toneIndex].frequency;
        meditationGain.gain.setValueAtTime(0.001, context.currentTime);
        meditationGain.gain.linearRampToValueAtTime(tones[toneIndex].volume, context.currentTime + 0.8);
        meditationOscillator.connect(meditationGain);
        meditationGain.connect(context.destination);
        meditationOscillator.start();
        meditationRunning = true;
        meditationButton.textContent = "Stop";
        meditationButton.classList.add("active");
      } else {
        const osc = meditationOscillator;
        const gain = meditationGain;
        gain.gain.setTargetAtTime(0.001, context.currentTime, 0.15);
        setTimeout(() => {
          try { osc.stop(); osc.disconnect(); gain.disconnect(); } catch {}
        }, 600);
        meditationOscillator = null;
        meditationGain = null;
        meditationRunning = false;
        meditationButton.textContent = "Start";
        meditationButton.classList.remove("active");
      }
    });

    showToneName();

    /* Meniul Mai mult */
    const moreBtn = document.getElementById("moreButton");
    const moreMenu = document.getElementById("moreMenu");
    moreBtn.addEventListener("click", () => moreMenu.classList.toggle("open"));
    document.addEventListener("click", (e) => {
      if (!moreBtn.contains(e.target) && !moreMenu.contains(e.target)) moreMenu.classList.remove("open");
    });
  </script>
</body>
